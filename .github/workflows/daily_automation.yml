name: Daily Nifty Chart Automation

on:
  schedule:
    # 9:00 AM IST is 3:30 AM UTC.
    # Run at 03:30 UTC Monday through Friday.
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium and OS-level dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run Automation Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PLAYWRIGHT_AUTH_STATE: ${{ secrets.PLAYWRIGHT_AUTH_STATE }}
        run: python run_automation.py
